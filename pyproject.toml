[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lulu"
version = "0.1.0.dev0"
description = "Initial service-boundary foundation for Project Lulu"
requires-python = ">=3.11"
dependencies = ["dbus-next>=0.2.3"]

[project.scripts]
console-sessiond = "lulu.sessiond:main"
console-catalogd = "lulu.consoled:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
