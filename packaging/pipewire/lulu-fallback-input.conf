# Lulu keeps a capture endpoint available for Proton/WinePulse.
# Without a non-monitor capture source, some Proton games can stall for
# repeated ~30-second WinePulse attempts before FMOD gives up. This virtual
# endpoint is intentionally not a microphone and does not change playback.
# The module's source_properties parser accepts one property value; priority
# is set here so real capture devices are preferred when they exist. The
# stable source_name identifies it as lulu_fallback_input to clients.
pulse.cmd = [
    {
        cmd = "load-module"
        args = "module-virtual-source source_name=lulu_fallback_input source_properties=priority.session=10"
        flags = [ ]
    }
]
