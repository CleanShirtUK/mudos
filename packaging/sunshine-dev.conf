# Development-only Sunshine host for the existing Lulu gamescope session.
# This file deliberately does not create or manage a display/session.
sunshine_name = Lulu Dev
capture = kms
encoder = software
sw_preset = ultrafast
sw_tune = zerolatency
hevc_mode = 1
av1_mode = 1
controller = disabled
stream_audio = disabled
upnp = disabled
address_family = ipv4
bind_address = 192.168.0.245
origin_web_ui_allowed = lan
csrf_allowed_origins = https://192.168.0.245:47990
port = 47989
min_log_level = info
system_tray = disabled
file_apps = apps.json
