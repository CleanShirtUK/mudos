# One source per physical or otherwise eligible standard gamepad. The explicit
# event selectors cover devices present when InputPlumber starts; the udev tag
# selector covers later hotplug without matching InputPlumber's own outputs.
version: 1
kind: CompositeDevice
name: Lulu Controller
maximum_sources: 1
matches: []
source_devices:
  - group: gamepad
    unique: true
    udev:
      properties:
        - name: MUDOS_STANDARD_GAMEPAD
          value: "1"
options:
  auto_manage: true
  persist: false
target_devices:
  - gamepad
  - keyboard
  - mouse
