id = "dolphin"
name = "Dolphin"
[capabilities]
launch = true
settings = true
health = true
[platforms]
supported = ["gamecube", "wii"]
[config]
strategy = "direct"
directory = "config"
[launch.standalone]
command = "/usr/bin/dolphin-emu"
controller_mode = "compat"
[launch.game]
command = "/usr/bin/dolphin-emu"

[[guide.actions]]
id = "dolphin-show-ui"
label = "Show Dolphin settings"
role = "provider"
target = "window-unfullscreen"
contexts = ["game", "standalone"]
order = 40

[[guide.actions]]
id = "dolphin-wiimote-sync"
label = "Sync Wii Remotes"
role = "provider"
target = "key:bracketright"
contexts = ["game", "standalone"]
order = 50

[[guide.actions]]
id = "dolphin-quit"
label = "Quit Dolphin"
role = "quit"
target = "process-group-terminate"
contexts = ["game", "standalone"]
order = 90
