id = "pcsx2"
name = "PCSX2"
[capabilities]
launch = true
settings = true
health = true
[platforms]
supported = ["ps2"]
[config]
strategy = "direct"
directory = "config"
[launch.standalone]
command = "/usr/local/bin/pcsx2-qt"
controller_mode = "compat"
[launch.game]
command = "/usr/local/bin/pcsx2-qt"

[[guide.actions]]
id = "pcsx2-menu"
label = "Open PCSX2 Menu"
role = "provider"
target = "key:F12"
contexts = ["game", "standalone"]
order = 10

[[guide.actions]]
id = "pcsx2-quit"
label = "Quit PCSX2"
role = "quit"
target = "process-group-terminate"
contexts = ["game", "standalone"]
order = 90
