id = "eden"
name = "Eden"
[capabilities]
launch = true
settings = true
[platforms]
supported = ["switch"]
[config]
strategy = "direct"
directory = "config"
[launch.standalone]
command = "/opt/lulu/current/packaging/eden-flatpak"
controller_mode = "compat"
[launch.game]
command = "/opt/lulu/current/packaging/eden-flatpak"

[[guide.actions]]
id = "eden-show-ui"
label = "Show Eden settings"
role = "provider"
target = "window-unfullscreen"
contexts = ["game", "standalone"]
order = 40

[[guide.actions]]
id = "eden-quit"
label = "Quit Eden"
role = "quit"
target = "process-group-terminate"
contexts = ["game", "standalone"]
order = 90
