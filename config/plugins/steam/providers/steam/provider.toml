id = "steam"
name = "Steam"
[capabilities]
launch = true
library = true
[platforms]
supported = ["pc"]
[config]
strategy = "redirected"
directory = "config"
[launch.standalone]
command = "/usr/bin/steam steam://open/main"
controller_mode = "compat"
window_class = "steam"
[launch.game]
command = "/usr/bin/steam"

[[guide.actions]]
id = "steam-overlay"
label = "Open Steam overlay"
role = "provider"
target = "key:Shift+Tab"
contexts = ["game"]
order = 40

[[guide.actions]]
id = "steam-quit"
label = "Quit Steam"
role = "quit"
target = "window-delete"
contexts = ["game", "standalone", "store", "downloads", "install"]
order = 90
