id = "gog"
name = "GOG"
version = "1"
api_version = 1
kind = "plugin"
providers = ["gog"]
description = "GOG ownership and gogdl-managed installation."
types = ["catalogue", "acquisition"]

[capabilities]
providers = true
installed_catalogue = true
available_catalogue = true
acquisition = true
authentication = true
launch = true
settings = true

[[provisioning]]
package = "heroic-gogdl"
reason = "Native GOG entitlement, install, update, repair, and launch backend."

[[secrets]]
slot = "auth"
label = "GOG authentication"
description = "Managed by gogdl; raw credentials are never stored by Mudos."
required = false
