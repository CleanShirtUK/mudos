id = "gog"
name = "GOG"

[capabilities]
launch = true
settings = true
library = true
acquire = true
health = true

[platforms]
supported = ["pc"]

[config]
strategy = "generated"
directory = "config"

[launch.standalone]
command = "gogdl auth"
controller_mode = "compat"

[launch.game]
command = "gogdl launch"
controller_mode = "game"

[[guide.actions]]
id = "gog-quit"
label = "Quit GOG game"
role = "quit"
target = "window-delete"
contexts = ["game", "standalone", "install"]
order = 90
