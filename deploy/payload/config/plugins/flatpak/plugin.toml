id = "flatpak"
name = "Flatpak"
version = "1"
api_version = 1
kind = "plugin"
description = "Discover and manage sandboxed Linux applications."
types = ["catalogue", "acquisition", "launch", "store"]
providers = ["flatpak"]

[capabilities]
provider = true
catalogue = true
acquisition = true
launch = true
install = true
update = true
uninstall = true
browser_handoff = true

[[browser_handoffs]]
id = "flatpakref"
schemes = ["flatpak+https"]
handler = "flatpakref"
trusted_origins = ["https://flathub.org"]
artifact_types = ["application/vnd.flatpak.ref"]

[[store_cards]]
id = "flathub"
label = "Flathub"
url = "https://flathub.org/"
glyph = "f324"
browser_profile = "flathub"
removable = false

[[services]]
id = "flatpak"
name = "Flatpak"
description = "Sandboxed applications managed by Mudos."
health = "flatpak"
configurable = true

[[provisioning]]
package = "flatpak"
reason = "Flatpak runtime and command-line lifecycle support"

[[provisioning]]
package = "python-gobject"
reason = "Optional libflatpak GI bindings"
