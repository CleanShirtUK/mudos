id = "romm"
name = "RomM"
version = "1"
api_version = 1
kind = "plugin"
providers = ["romm"]
description = "RomM game library and artwork integration."
types = ["catalogue", "acquisition", "configuration"]

[capabilities]
installed_catalogue = true
metadata = true
acquisition = true
settings = true

[[secrets]]
slot = "api-key"
label = "RomM access key"
description = "A private key used to connect Mudos to RomM."
required = false

[configuration.fields.url]
type = "url"
label = "RomM server address"
description = "The address of your RomM server."
required = false
