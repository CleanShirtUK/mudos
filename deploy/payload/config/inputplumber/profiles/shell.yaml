version: 1
kind: DeviceProfile
name: Lulu SHELL
description: Semantic controller navigation for the Lulu Qt Quick shell
mapping:
  - name: D-pad up
    source_event:
      gamepad:
        button: DPadUp
    target_events:
      - keyboard: KeyUp
  - name: D-pad down
    source_event:
      gamepad:
        button: DPadDown
    target_events:
      - keyboard: KeyDown
  - name: D-pad left
    source_event:
      gamepad:
        button: DPadLeft
    target_events:
      - keyboard: KeyLeft
  - name: D-pad right
    source_event:
      gamepad:
        button: DPadRight
    target_events:
      - keyboard: KeyRight
  - name: Left stick up
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: up
          deadzone: 0.3
    target_events:
      - keyboard: KeyUp
  - name: Left stick down
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: down
          deadzone: 0.3
    target_events:
      - keyboard: KeyDown
  - name: Left stick left
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: left
          deadzone: 0.3
    target_events:
      - keyboard: KeyLeft
  - name: Left stick right
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: right
          deadzone: 0.3
    target_events:
      - keyboard: KeyRight
  - name: South activates
    source_event:
      gamepad:
        button: South
    target_events:
      - keyboard: KeyEnter
  - name: Left bumper previous collection
    source_event:
      gamepad:
        button: LeftBumper
    target_events:
      - keyboard: KeyPageUp
  - name: Right bumper next collection
    source_event:
      gamepad:
        button: RightBumper
    target_events:
      - keyboard: KeyPageDown
  - name: East goes back
    source_event:
      gamepad:
        button: East
    target_events:
      - keyboard: KeyBackspace
